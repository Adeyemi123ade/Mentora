name: mentora

services:
  postgres:
    image: postgres:16-alpine
    container_name: mentora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mentora
      POSTGRES_USER: mentora
      POSTGRES_PASSWORD: mentora
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: mentora-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  postgres_data:
