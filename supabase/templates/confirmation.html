<!doctype html>
<html lang="en">
  <body style="margin:0;background:#f7f9fc;font-family:Arial,Helvetica,sans-serif;color:#101638">
    <div style="max-width:480px;margin:32px auto;padding:32px;background:#ffffff;border:1px solid #e4e9f2;border-radius:8px">
      <h1 style="margin:0 0 12px;font-size:24px">Verify your email</h1>
      <p style="margin:0;color:#53617e;line-height:1.6">Enter this 6-digit code in Mentora to activate your account:</p>
      <p style="margin:28px 0;font-size:32px;font-weight:700;letter-spacing:8px;color:#075cff">{{ .Token }}</p>
      <p style="margin:0;color:#53617e;font-size:13px;line-height:1.6">The code expires shortly. If you did not create a Mentora account, you can ignore this email.</p>
    </div>
  </body>
</html>
